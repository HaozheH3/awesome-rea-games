<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Awesome REA Games</title>
  <desc id="desc">A collection of game decompilations, recompilations, ports and demos, illustrated with a pixel game scene and a source code window.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b30"/>
      <stop offset="1" stop-color="#26314d"/>
    </linearGradient>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#375b8a"/>
      <stop offset="1" stop-color="#8fd5bd"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#9db5c4" stroke-opacity=".1"/>
    </pattern>
    <clipPath id="frame"><rect width="1400" height="430" rx="20"/></clipPath>
    <clipPath id="game-screen"><rect x="893" y="57" width="230" height="180" rx="5"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1400" height="430" fill="url(#background)"/>
    <rect width="1400" height="430" fill="url(#grid)"/>
    <circle cx="1260" cy="120" r="260" fill="#67d8c2" opacity=".07"/>
    <path d="M0 0H1400" stroke="#75d8c7" stroke-width="7"/>
    <path d="M0 429H1400" stroke="#edaf6f" stroke-opacity=".5" stroke-width="2"/>
    <text x="64" y="153" fill="#fcf9f0" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">AWESOME REA GAMES</text>
    <path d="M64 181H797" stroke="#a5bac8" stroke-opacity=".45" stroke-width="1"/>
    <text x="64" y="250" fill="#dce9ea" font-family="Arial, Helvetica, sans-serif" font-size="46">A collection of game</text>
    <text x="64" y="307" fill="#dce9ea" font-family="Arial, Helvetica, sans-serif" font-size="46">decompilations,</text>
    <text x="64" y="364" fill="#dce9ea" font-family="Arial, Helvetica, sans-serif" font-size="46">recompilations, ports &amp; demos.</text>
    <g transform="translate(-115 31) scale(1.1)">
    <rect x="879" y="43" width="258" height="245" rx="13" fill="#efb878"/>
    <rect x="889" y="53" width="238" height="225" rx="7" fill="#f8e7c8"/>
    <g clip-path="url(#game-screen)">
      <rect x="893" y="57" width="230" height="180" fill="url(#sky)"/>
      <circle cx="1050" cy="104" r="32" fill="#ffd47e"/>
      <path d="M893 189L932 152L965 170L1014 122L1068 179L1123 143V237H893Z" fill="#325c70"/>
      <path d="M893 205L949 170L986 191L1042 154L1123 197V237H893Z" fill="#459184"/>
      <rect x="893" y="218" width="230" height="19" fill="#365d4b"/>
      <rect x="937" y="199" width="60" height="9" fill="#df9a5e"/>
      <rect x="947" y="208" width="41" height="8" fill="#a46b4d"/>
      <rect x="962" y="180" width="13" height="15" fill="#f8cc93"/>
      <rect x="958" y="195" width="21" height="15" fill="#e97f69"/>
      <rect x="959" y="210" width="7" height="10" fill="#273e5b"/>
      <rect x="972" y="210" width="7" height="10" fill="#273e5b"/>
      <rect x="918" y="91" width="30" height="8" fill="#eef6e8" opacity=".75"/>
      <rect x="924" y="85" width="18" height="6" fill="#eef6e8" opacity=".75"/>
    </g>
    <rect x="904" y="250" width="76" height="7" rx="3" fill="#39596a"/>
    <rect x="904" y="264" width="140" height="5" rx="2" fill="#9bab9e"/>
    <text x="1071" y="265" fill="#39596a" font-family="monospace" font-size="14" font-weight="700">01</text>
    <path d="M1146 165H1172" stroke="#f4b36f" stroke-width="3" stroke-dasharray="5 5"/>
    <path d="M1164 158L1173 165L1164 172" fill="none" stroke="#f4b36f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1181" y="62" width="190" height="225" rx="12" fill="#0a1527" stroke="#789baa" stroke-width="2"/>
    <path d="M1181 99H1371" stroke="#486172" stroke-width="2"/>
    <circle cx="1200" cy="81" r="5" fill="#f4b36f"/>
    <circle cx="1218" cy="81" r="5" fill="#71dbc5"/>
    <circle cx="1236" cy="81" r="5" fill="#7b93a5"/>
    <text x="1295" y="86" fill="#b9ccd1" font-family="monospace" font-size="12">game.c</text>
    <text x="1197" y="127" fill="#6f8a9b" font-family="monospace" font-size="12">01</text>
    <text x="1227" y="127" fill="#dce9e8" font-family="monospace" font-size="12">int main() {</text>
    <text x="1197" y="150" fill="#6f8a9b" font-family="monospace" font-size="12">02</text>
    <text x="1227" y="150" fill="#72dcc7" font-family="monospace" font-size="12">restore(game);</text>
    <text x="1197" y="173" fill="#6f8a9b" font-family="monospace" font-size="12">03</text>
    <text x="1227" y="173" fill="#f4b36f" font-family="monospace" font-size="12">play();</text>
    <text x="1197" y="196" fill="#6f8a9b" font-family="monospace" font-size="12">04</text>
    <text x="1227" y="196" fill="#dce9e8" font-family="monospace" font-size="12">}</text>
    <path d="M1198 222H1342" stroke="#476072" stroke-width="6" stroke-linecap="round"/>
    <path d="M1198 241H1304" stroke="#476072" stroke-width="6" stroke-linecap="round"/>
    <path d="M1198 260H1327" stroke="#476072" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
